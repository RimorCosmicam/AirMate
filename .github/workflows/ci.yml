name: Native builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -c debug
      - name: Tests
        run: swift test
      - name: Package test app
        run: |
          mkdir -p dist/AirMate.app/Contents/MacOS
          cp .build/debug/AirMateMac dist/AirMate.app/Contents/MacOS/AirMate
          cp Resources/Info.plist dist/AirMate.app/Contents/Info.plist
          codesign --force --deep --sign - dist/AirMate.app
          codesign --verify --deep --strict dist/AirMate.app
          test -x dist/AirMate.app/Contents/MacOS/AirMate
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' dist/AirMate.app/Contents/Info.plist)" = "AirMate"
          ditto -c -k --sequesterRsrc --keepParent dist/AirMate.app dist/AirMate-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: airmate-macos-arm64
          path: mac/dist/AirMate-macOS-arm64.zip

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and test
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: airmate-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
