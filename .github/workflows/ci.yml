name: Native builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    needs: android
    runs-on: xcode-27
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: airmate-android-debug
          path: build-artifacts/android
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -c debug
      - name: Compile tests
        # GitHub's Xcode 27 preview image still boots an older macOS, so a
        # macOS 27-only test bundle can be compiled here but cannot be loaded.
        run: swift build --build-tests
      - name: Package test app
        run: |
          mkdir -p dist/AirMate.app/Contents/MacOS dist/AirMate.app/Contents/Resources dist/AppIcon.iconset
          sips -z 16 16 Resources/AppIcon.png --out dist/AppIcon.iconset/icon_16x16.png
          sips -z 32 32 Resources/AppIcon.png --out dist/AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32 Resources/AppIcon.png --out dist/AppIcon.iconset/icon_32x32.png
          sips -z 64 64 Resources/AppIcon.png --out dist/AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128 Resources/AppIcon.png --out dist/AppIcon.iconset/icon_128x128.png
          sips -z 256 256 Resources/AppIcon.png --out dist/AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256 Resources/AppIcon.png --out dist/AppIcon.iconset/icon_256x256.png
          sips -z 512 512 Resources/AppIcon.png --out dist/AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512 Resources/AppIcon.png --out dist/AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 Resources/AppIcon.png --out dist/AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns dist/AppIcon.iconset -o dist/AirMate.app/Contents/Resources/AppIcon.icns
          cp .build/debug/AirMateMac dist/AirMate.app/Contents/MacOS/AirMate
          cp Resources/Info.plist dist/AirMate.app/Contents/Info.plist
          cp ../build-artifacts/android/app-debug.apk dist/AirMate.app/Contents/Resources/AirMate.apk
          codesign --force --deep --sign - dist/AirMate.app
          codesign --verify --deep --strict dist/AirMate.app
          test -x dist/AirMate.app/Contents/MacOS/AirMate
          test -f dist/AirMate.app/Contents/Resources/AirMate.apk
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' dist/AirMate.app/Contents/Info.plist)" = "AirMate"
          ditto -c -k --sequesterRsrc --keepParent dist/AirMate.app dist/AirMate-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: airmate-macos-arm64
          path: mac/dist/AirMate-macOS-arm64.zip

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and test
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: airmate-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
